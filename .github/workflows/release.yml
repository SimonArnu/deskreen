on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: release Linux

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create GitHub Release (draft)
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          echo "Ensuring draft release for tag: $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping creation"
          else
            gh release create "$tag" \
              --title "$tag" \
              --draft \
              --notes ""
          fi

  release:
    name: Release (${{ matrix.build_name }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_name: linux-x64
            build_command: build:linux
            artifact_name: 'dist/{*.AppImage,*.deb,*.yml}'
          - os: ubuntu-latest
            platform: linux
            build_name: linux-arm64
            build_command: build:linux:arm64
            artifact_name: 'dist/{*.AppImage,*.deb,*.yml}'
          - os: ubuntu-latest
            platform: linux
            build_name: linux-arm32
            build_command: build:linux:armv7l
            artifact_name: 'dist/{*.AppImage,*.deb,*.yml}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: npm install in ./src/client-viewer
        run: |
          cd ./src/client-viewer
          npm ci

      - name: npm install in ./
        run: npm ci

      - name: Install Linux build dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: npm build on Linux
        if: ${{ matrix.platform == 'linux' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.build_command }}

      - name: Rename Linux update manifest for non-x64
        if: ${{ matrix.platform == 'linux' }}
        run: |
          if [ -f dist/latest-linux.yml ]; then
            mv dist/latest-linux.yml dist/latest-${{ matrix.build_name }}.yml
          fi

      - name: Upload binaries to release
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: ${{ matrix.artifact_name }}
          tags: true
          draft: true
